spring:
  application:
    name: taskflow-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      # Override with TASKFLOW_JWT_SECRET in every non-local environment.
      secret: ${TASKFLOW_JWT_SECRET:VGhpc0lzQURldk9ubHlTZWNyZXRLZXlGb3JUYXNrRmxvd0pXVFNpZ25pbmcxMjM0NTY=}
      access-token-minutes: 15
      refresh-token-days: 14
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.taskflow: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    logResponseBody: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"

